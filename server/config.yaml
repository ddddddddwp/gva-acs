zap:
    level: info
    prefix: '[github.com/flipped-aurora/gin-vue-admin/server]'
    format: console
    director: log
    encode-level: LowercaseColorLevelEncoder
    stacktrace-key: stacktrace
    show-line: true
    log-in-console: true
    retention-day: -1
tr069:
    address: :7458
    debug: true
    dumpRaw: true           # [终端开关] true: 在控制台打印原始报文; false: 关闭控制台输出
    # dumpMaxBytes: 日志打印的最大字节数，防止报文过大刷屏（默认65536即64KB，推荐1048576即1MB以防截断）
    dumpMaxBytes: 1048576
    dumpRedactAuth: true
    dumpRedactCookie: true
    infoLogEnable: true     # [文件开关] true: 写入 tr069info.log; false: 关闭文件写入
    infoLogDir: ./log       # 日志文件存储路径 (默认 ./log/YYYY-MM-DD/tr069info.log)
    
    # ==================== REDIS 队列配置 ====================
    # commandQueueLockTTL: 设备级别分布式锁的 TTL（秒），默认 30 秒
    commandQueueLockTTL: 30
    # commandQueueDedupTTL: 去重 key 的 TTL（秒），默认 86400 秒（24 小时）
    commandQueueDedupTTL: 86400
    # commandQueueMaxScan: 每次从队列获取命令的最大扫描次数，默认 10
    commandQueueMaxScan: 10
    # commandQueueMaxPendingPerSession: 每次 session 最多处理的 pending 命令数量，避免饥饿，默认 5
    commandQueueMaxPendingPerSession: 5
    # commandQueueImmediateTTL: 立即下发队列的 TTL（秒），默认 1800 秒（30 分钟）
    commandQueueImmediateTTL: 1800
 