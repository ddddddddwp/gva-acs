<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TR069 调试工具</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.0/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏导航 -->
        <nav id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h3>TR069 调试工具</h3>
            </div>
            <ul class="sidebar-menu">
                <li class="sidebar-item active" data-page="parser">
                    <a href="#"><i class="bi bi-code-slash"></i> 消息解析</a>
                </li>
                <li class="sidebar-item" data-page="builder">
                    <a href="#"><i class="bi bi-hammer"></i> 消息构建</a>
                </li>
            </ul>
        </nav>

        <!-- 主内容区域 -->
        <div class="main-content">
            <!-- 顶部导航栏 -->
            <header class="top-navbar">
                <button id="sidebar-toggle" class="sidebar-toggle">
                    <i class="bi bi-list"></i>
                </button>
                <div class="user-menu">
                    <span class="user-name">TR069 核心库</span>
                </div>
            </header>

            <!-- 页面内容 -->
            <div id="page-content" class="page-content">
                <!-- 消息解析页面 -->
                <div id="parser-page" class="content-page active">
                    <h1>TR069 消息解析</h1>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-header">
                                    <h5>输入XML消息</h5>
                                </div>
                                <div class="card-body">
                                    <textarea id="xml-input" class="form-control" rows="15" placeholder="请输入TR069 XML消息..."></textarea>
                                    <div class="mt-3">
                                        <button id="parse-btn" class="btn btn-primary">
                                            <i class="bi bi-play-circle"></i> 解析消息
                                        </button>
                                        <button class="btn btn-outline-secondary example-btn" data-example="inform">
                                            <i class="bi bi-file-text"></i> 加载Inform示例
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-header">
                                    <h5>解析结果</h5>
                                </div>
                                <div class="card-body">
                                    <div id="parse-result" class="result-container">等待解析...</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 消息构建页面 -->
                <div id="builder-page" class="content-page">
                    <h1>TR069 消息构建</h1>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-header">
                                    <h5>构建参数</h5>
                                </div>
                                <div class="card-body">
                                    <div class="mb-3">
                                        <label class="form-label">RPC方法</label>
                                        <select id="rpc-method" class="form-select">
                                            <option value="GetParameterValues">GetParameterValues</option>
                                            <option value="SetParameterValues">SetParameterValues</option>
                                            <option value="Inform">Inform</option>
                                            <option value="GetRPCMethods">GetRPCMethods</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">参数 (JSON格式)</label>
                                        <textarea id="build-params" class="form-control" rows="10" placeholder='{"ParameterNames": ["Device.DeviceInfo."]}'></textarea>
                                    </div>
                                    <div>
                                        <button id="build-btn" class="btn btn-success">
                                            <i class="bi bi-hammer"></i> 构建消息
                                        </button>
                                        <button class="btn btn-outline-secondary example-btn" data-example="getParameterValues">
                                            <i class="bi bi-file-text"></i> GetParameterValues示例
                                        </button>
                                        <button class="btn btn-outline-secondary example-btn" data-example="setParameterValues">
                                            <i class="bi bi-file-text"></i> SetParameterValues示例
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-header">
                                    <h5>构建结果</h5>
                                </div>
                                <div class="card-body">
                                    <div id="build-result" class="result-container">等待构建...</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
                                    
                                        <input type="text" id="ssl-key" name="sslKey">
                                    </div>
                                    <div class="form-group">
                                        <label for="auth-method">认证方式</label>
                                        <select id="auth-method" name="authMethod">
                                            <option value="basic">基本认证</option>
                                            <option value="digest">摘要认证</option>
                                            <option value="token">令牌认证</option>
                                        </select>
                                    </div>
                                    <div class="form-actions">
                                        <button type="submit" class="btn btn-primary">保存设置</button>
                                        <button type="reset" class="btn btn-secondary">重置</button>
                                    </div>
                                </form>
                            </div>
                            <div id="integration-settings-tab" class="tab-pane">
                                <form id="integration-settings-form" class="settings-form">
                                    <div class="form-group">
                                        <label for="enable-api">启用API接口</label>
                                        <div class="toggle-switch">
                                            <input type="checkbox" id="enable-api" name="enableAPI">
                                            <label for="enable-api"></label>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label for="api-key">API密钥</label>
                                        <div class="input-with-button">
                                            <input type="text" id="api-key" name="apiKey" readonly>
                                            <button type="button" id="generate-api-key" class="btn btn-secondary">生成</button>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label for="webhook-url">Webhook URL</label>
                                        <input type="url" id="webhook-url" name="webhookURL">
                                    </div>
                                    <div class="form-group">
                                        <label for="webhook-events">Webhook事件</label>
                                        <div class="checkbox-group">
                                            <div class="checkbox-item">
                                                <input type="checkbox" id="event-device-online" name="webhookEvents" value="device_online">
                                                <label for="event-device-online">设备上线</label>
                                            </div>
                                            <div class="checkbox-item">
                                                <input type="checkbox" id="event-device-offline" name="webhookEvents" value="device_offline">
                                                <label for="event-device-offline">设备离线</label>
                                            </div>
                                            <div class="checkbox-item">
                                                <input type="checkbox" id="event-parameter-change" name="webhookEvents" value="parameter_change">
                                                <label for="event-parameter-change">参数变更</label>
                                            </div>
                                            <div class="checkbox-item">
                                                <input type="checkbox" id="event-alarm" name="webhookEvents" value="alarm">
                                                <label for="event-alarm">告警事件</label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-actions">
                                        <button type="submit" class="btn btn-primary">保存设置</button>
                                        <button type="reset" class="btn btn-secondary">重置</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 加载脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
